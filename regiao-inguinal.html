<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><meta name="description" content="Regiões inguinais, hérnias e avaliação dinâmica."><title>Ultrassonografia — Região Inguinal</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>:root{--p:#0f766e;--bg:#f0fdfa;--bd:#99f6e4;--ink:#1f2937}*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;padding:14px;background:var(--bg);color:var(--ink)}main{max-width:850px;margin:auto}h1{text-align:center;color:#115e59;font-size:22px}h2{font-size:17px;color:#0f766e;border-left:4px solid var(--p);padding-left:9px}h3{font-size:15px}.card{background:white;padding:16px;border-radius:13px;margin:12px 0;box-shadow:0 2px 6px #0001}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fafafa;font-size:15px;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}button{padding:12px;border:0;border-radius:9px;background:var(--p);color:white;font-weight:bold;cursor:pointer;margin:8px 6px 0 0}.secondary{background:#475569}.green{background:#059669}.result{padding:10px;background:#f0fdfa;border-radius:8px;margin-top:10px;line-height:1.5}.small{font-size:12px;color:#64748b;line-height:1.45}textarea{min-height:100px;line-height:1.5}.toplink{display:inline-block;color:#0f766e;text-decoration:none;font-weight:bold;margin-bottom:5px}@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3>div:last-child{grid-column:1/-1}}@media print{.no-print{display:none!important}body{background:white;padding:0}main{max-width:none}.card{box-shadow:none;border:0;border-bottom:1px solid #ddd;padding:8px;margin:0}textarea{border:0;padding:0;min-height:100px}h1{font-size:18pt}}</style></head><body><main><a class="toplink no-print" href="./">← Início das calculadoras</a><h1>Ultrassonografia — Região Inguinal</h1><p style="text-align:center;color:#64748b;font-size:12px">Regiões inguinais, hérnias e avaliação dinâmica.</p><section class="card no-print"><h2>Identificação e técnica</h2><div class="grid"><div><label for="paciente">Paciente</label><input id="paciente"></div><div><label for="data">Data do exame</label><input id="data" type="date"></div><div><label for="indicacao">Indicação clínica</label><input id="indicacao"></div><div><label for="tecnica">Condições técnicas</label><select id="tecnica"><option>Adequadas</option><option>Limitadas</option><option>Parcialmente limitadas</option></select></div></div></section><section class="card"><h2>Região inguinal</h2>
<div class="grid"><div><label for="inguinalD">Região inguinal direita</label><select id="inguinalD"><option>Sem hérnia identificável</option><option>Hérnia inguinal identificada</option><option>Linfonodos aumentados</option><option>Lesão / massa</option><option>Avaliação limitada</option></select></div>
<div><label for="inguinalE">Região inguinal esquerda</label><select id="inguinalE"><option>Sem hérnia identificável</option><option>Hérnia inguinal identificada</option><option>Linfonodos aumentados</option><option>Lesão / massa</option><option>Avaliação limitada</option></select></div>
<div><label for="inguinalManobra">Manobra dinâmica</label><select id="inguinalManobra"><option>Repouso e Valsalva</option><option>Repouso</option><option>Valsalva</option><option>Ortostatismo e Valsalva</option></select></div>
<div><label for="redutibilidade">Redutibilidade (se houver hérnia)</label><select id="redutibilidade"><option>Não se aplica</option><option>Redutível</option><option>Parcialmente redutível</option><option>Não redutível</option></select></div>
<div><label for="coloInguinalD">Colo herniário direito (mm)</label><input id="coloInguinalD" type="number" min="0" step="0.1"></div>
<div><label for="coloInguinalE">Colo herniário esquerdo (mm)</label><input id="coloInguinalE" type="number" min="0" step="0.1"></div>
<div><label for="conteudoInguinal">Conteúdo herniário</label><select id="conteudoInguinal"><option>Não se aplica</option><option>Gordura</option><option>Alça intestinal</option><option>Gordura e alça intestinal</option><option>Outro</option></select></div></div>
<label for="inguinalObs">Descrição, medidas, lateralidade e observações</label><textarea id="inguinalObs" style="min-height:65px"></textarea></section><section class="card no-print"><h2>Laudo</h2><button type="button" id="gerar">GERAR LAUDO</button><button type="button" class="secondary" id="imprimir">IMPRIMIR</button><button type="button" class="green" id="copiar">COPIAR LAUDO</button></section><section class="card"><h2>LAUDO DE ULTRASSONOGRAFIA</h2><textarea id="laudo" placeholder="O laudo gerado aparecerá aqui e poderá ser editado."></textarea></section><p class="small" style="text-align:center">Ferramenta auxiliar. Confira imagens, medidas e achados antes de assinar o laudo.</p></main><script>(()=>{const $=id=>document.getElementById(id),v=id=>$(id)?.value?.trim()||"",fmt=x=>x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});function gerar(){const out=["ULTRASSONOGRAFIA — REGIÃO INGUINAL"];if(v('paciente'))out.push("Paciente: "+v('paciente'));if(v('data'))out.push("Data: "+v('data').split('-').reverse().join('/'));if(v('indicacao'))out.push("Indicação clínica: "+v('indicacao'));out.push("Condições técnicas: "+v('tecnica')+".");const groups=[...document.querySelectorAll('section.card')].filter(s=>s.querySelector('h2')&&!['Identificação e técnica','Laudo','LAUDO DE ULTRASSONOGRAFIA'].includes(s.querySelector('h2').textContent.trim()));for(const g of groups){const h=g.querySelector('h2')?.textContent.trim()||'';const lines=[];g.querySelectorAll('label').forEach(l=>{const el=g.querySelector('#'+CSS.escape(l.htmlFor));if(el&&el.value)lines.push(l.textContent.trim()+': '+el.value+'.')});if(lines.length)out.push('\n'+h.toUpperCase()+'\n'+lines.join('\n'));}$('laudo').value=out.join('\n')} $('gerar').addEventListener('click',gerar);$('imprimir').addEventListener('click',()=>{if(!v('laudo'))gerar();window.print()});$('copiar').addEventListener('click',async()=>{if(!v('laudo'))gerar();try{await navigator.clipboard.writeText(v('laudo'));$('copiar').textContent='LAUDO COPIADO'}catch(e){$('laudo').select();document.execCommand('copy')}})})();</script></body></html>
